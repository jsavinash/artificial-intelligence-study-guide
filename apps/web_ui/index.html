<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Tutorial — Full-Stack Demo</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --accent:#5b8cff; --ok:#3ecf8e; --text:#e6e9f0; --dim:#8b93a7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 28px; border-bottom:1px solid #232735; display:flex; gap:16px; align-items:center; }
  h1 { font-size:18px; margin:0; }
  #status { font-size:13px; color:var(--dim); }
  #status.ok { color:var(--ok); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:18px; padding:20px 28px; max-width:1200px; margin:0 auto; }
  section { background:var(--panel); border:1px solid #232735; border-radius:10px; padding:16px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
  textarea, input { width:100%; background:#0c0e14; color:var(--text); border:1px solid #2a2f40;
                    border-radius:6px; padding:9px; font-size:14px; resize:vertical; }
  textarea { min-height:70px; }
  button { margin-top:10px; background:var(--accent); border:0; color:#fff; padding:9px 16px;
           border-radius:6px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  pre { background:#0c0e14; border:1px solid #2a2f40; border-radius:6px; padding:10px;
        font-size:12.5px; white-space:pre-wrap; word-break:break-word; min-height:46px; max-height:260px; overflow:auto; }
  .cite { display:inline-block; background:#2a2f40; border-radius:4px; padding:1px 6px; margin:2px; font-size:12px; }
  .muted { color:var(--dim); font-size:12px; }
  .row { display:flex; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>🤖 AI Tutorial — Monorepo UI</h1>
  <span id="status">checking API…</span>
  <span class="muted">API :8000 · UI :8080 · <code>make serve</code> + <code>make ui</code></span>
</header>
<main>
  <section>
    <h2>Health</h2>
    <button onclick="health()">Refresh /health</button>
    <pre id="health">—</pre>
  </section>

  <section>
    <h2>Predict <span class="muted">(registry model, 6 features)</span></h2>
    <div class="row">
      <input id="feats" value="0.1, -0.4, 1.2, 0.8, -1.0, 0.3" />
    </div>
    <button onclick="predict()">POST /predict</button>
    <pre id="pred">—</pre>
  </section>

  <section>
    <h2>RAG chat <span class="muted">(grounded + citations)</span></h2>
    <textarea id="q">How does LoRA fine-tune a frozen model?</textarea>
    <button onclick="ask()">Ask /rag</button>
    <pre id="rag">—</pre>
    <div id="cites"></div>
  </section>

  <section>
    <h2>Agent <span class="muted">(tool loop + trace)</span></h2>
    <textarea id="goal">What is 12 * 8?</textarea>
    <button onclick="runAgent()">Run /agents/run</button>
    <pre id="agent">—</pre>
  </section>

  <section style="grid-column: 1 / -1;">
    <h2>Raw generate <span class="muted">(provider-aware: mock now, real API with a key)</span></h2>
    <div class="row">
      <textarea id="prompt">Summarize what retrieval-augmented generation is and why it helps.</textarea>
    </div>
    <button onclick="generate()">POST /generate</button>
    <pre id="gen">—</pre>
  </section>
</main>

<script>
const API = "http://127.0.0.1:8000";
const show = (id, v) => document.getElementById(id).textContent =
  typeof v === "string" ? v : JSON.stringify(v, null, 2);

async function call(path, body, method = "POST") {
  try {
    const r = await fetch(API + path, { method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined });
    return await r.json();
  } catch (e) { return { error: "API unreachable — start it with `make serve`", detail: String(e) }; }
}

async function health() {
  const d = await call("/health", null, "GET");
  show("health", d);
  const s = document.getElementById("status");
  if (d.status === "ok") { s.textContent = `API ✓ provider=${d.provider} model=${d.model ?? "none"}`; s.className = "ok"; }
  else { s.textContent = "API offline"; s.className = ""; }
}

async function predict() {
  const features = document.getElementById("feats").value.split(",").map(Number);
  show("pred", await call("/predict", { features }));
}

async function ask() {
  const d = await call("/rag", { question: document.getElementById("q").value });
  show("rag", d.answer ? d.answer + `\n\n(${d.ms}ms, provider=${d.provider})` : d);
  document.getElementById("cites").innerHTML =
    (d.citations || []).map(c => `<span class="cite">${c}</span>`).join("");
}

async function runAgent() {
  const d = await call("/agents/run", { goal: document.getElementById("goal").value });
  show("agent", d.answer
    ? `answer: ${d.answer}\nsteps: ${d.steps} · tool_calls: ${d.tool_calls} · ${d.ms}ms\n` +
      (d.trace || []).map(t => `  s${t.step}: ${t.detail}`).join("\n")
    : d);
}

async function generate() {
  const d = await call("/generate", { prompt: document.getElementById("prompt").value });
  show("gen", d.output ? d.output + `\n\n(provider=${d.provider}, ${d.ms}ms)` : d);
}

health();
</script>
</body>
</html>
